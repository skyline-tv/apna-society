services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apna-society-api-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/apna_society?replicaSet=rs0&directConnection=true
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme-redis-password}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-apna:}
      VISITOR_EXPIRY_WORKER_ENABLED: ${VISITOR_EXPIRY_WORKER_ENABLED:-true}
      ANNOUNCEMENT_WORKER_ENABLED: ${ANNOUNCEMENT_WORKER_ENABLED:-true}
      FACILITY_BOOKING_WORKER_ENABLED: ${FACILITY_BOOKING_WORKER_ENABLED:-true}
      COMPLAINT_STORAGE_LOCAL_DIR: /data/storage/complaints
      ANNOUNCEMENT_STORAGE_LOCAL_DIR: /data/storage/announcements
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - api_storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - apna-internal

  # MongoDB is intentionally NOT published to the host by default.
  mongo:
    image: mongo:7
    container_name: apna-society-mongo-v2
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo_data:/data/db
      - mongo_backups:/backups
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - apna-internal

  mongo-init-replica:
    image: mongo:7
    container_name: apna-society-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - apna-internal
    restart: 'no'
    entrypoint: >
      mongosh --host mongo --eval
      'try { rs.status() } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"mongo:27017"}]}) }'

  # Redis is private to apna-internal — no host port publish.
  redis:
    image: redis:7-alpine
    container_name: apna-society-redis-v2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      - --requirepass
      - ${REDIS_PASSWORD:-changeme-redis-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme-redis-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - apna-internal

volumes:
  mongo_data:
  mongo_backups:
  api_storage:
  redis_data:

networks:
  apna-internal:
    driver: bridge
