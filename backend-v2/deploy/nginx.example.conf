# Example reverse proxy for Apna Society backend-v2 (TLS terminated here).
# Replace server_name and certificate paths before use.

upstream apna_api_v2 {
  server 127.0.0.1:4000;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name api.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 8m;

  location / {
    proxy_pass http://apna_api_v2;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://apna_api_v2/health;
  }
}

server {
  listen 80;
  server_name api.example.com;
  return 301 https://$host$request_uri;
}
