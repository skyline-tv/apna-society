name: apna_society
description: ApnaSociety local-first demo for Monarch Solitaire A to E society maintenance (Android and iOS).
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  drift: ^2.28.1
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.4
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.6
  speech_to_text: ^7.3.0
  razorpay_flutter: ^1.4.7
  share_plus: ^12.0.2
  socket_io_client: ^3.1.6
  image_picker: ^1.2.4
  crypto: ^3.0.7
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.1
  flutter_launcher_icons: ^0.14.3
  sqlite3: ^2.9.4

# image 4.11.0 calls ZLibDecoder.decodeLazy, which archive 4.0.9 does not provide.
dependency_overrides:
  image: 4.10.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icons/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
